name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'

      - name: Build Flutter APK
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          flutter create jarvis
          cp -r lib jarvis/
          cp pubspec.yaml jarvis/
          cd jarvis
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: jarvis/build/app/outputs/flutter-apk/app-release.apk
